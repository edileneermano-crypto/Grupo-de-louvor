<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#7b001c"
    >

    <title>Escala - Praise Group</title>

    <link rel="icon" href="../imagens/logo.png">

    <link rel="stylesheet" href="escala.css">

<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="escala-header">

        <div>
            <h1>Praise Group</h1>
            <p>Escala do Louvor</p>
        </div>

        <a href="../index.html" class="voltar">
            ← Voltar
        </a>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="escala-container">

        <!-- TÍTULO -->

        <section class="titulo">

            <h2>Escala de Louvor</h2>

            <p>
                Organize a escala das igrejas
            </p>

        </section>


        <!-- =================================================
             IGREJAS
        ================================================== -->

        <section class="igrejas">


            <!-- SEDE -->

            <button
                class="igreja-card"
                data-igreja="sede"
                type="button"
            >

                <span class="igreja-icon" aria-hidden="true">

                    <svg
                        viewBox="0 0 64 64"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <!-- Telhado -->

                        <path
                            d="M8 28 L32 8 L56 28"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <!-- Corpo -->

                        <path
                            d="M12 27 V56 H52 V27"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linejoin="round"
                        />

                        <!-- Cruz -->

                        <path
                            d="M32 8 V20"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M27 14 H37"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <!-- Porta -->

                        <path
                            d="M26 56 V40 H38 V56"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                        />

                        <!-- Janelas -->

                        <rect
                            x="17"
                            y="34"
                            width="7"
                            height="8"
                            rx="1"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <rect
                            x="40"
                            y="34"
                            width="7"
                            height="8"
                            rx="1"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                    </svg>

                </span>

                <strong>Sede</strong>

                <small>
                    Escala da Sede
                </small>

            </button>


            <!-- MARILENA -->

            <!-- SANTA LIDIA -->

            >

                <span class="igreja-icon" aria-hidden="true">

                    <svg
                        viewBox="0 0 64 64"

                        <path
                            d="M8 28 L32 8 L56 28"
                            fill="none"

        <!-- =================================================
             ÁREA DA ESCALA
        ================================================== -->

        <section
            id="areaEscala"
            class="area-escala"
        >

            <div class="mensagem-inicial">

                <div class="icone-calendario" aria-hidden="true">

                <h3>
                    Selecione uma igreja

                    Escolha uma das igrejas acima
                    para visualizar e organizar a escala.
                </p>

            </div>

    <script type="module" src="../script.js"></script>

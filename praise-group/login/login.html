<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#7b001c"
  >

  <title>Acesso - Praise Group</title>

  <link rel="icon" href="../../imagens/logo.png">

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <!-- LOGO -->
      <div class="login-logo-container">
        <img
          src="../../imagens/logo.png"
          alt="Praise Group"
          class="login-logo"
        >
      </div>

      <!-- TÍTULO -->
      <h1>Praise Group</h1>

      <p class="login-subtitle">
        Grupo de Louvor
      </p>


      <!-- LOGIN -->
      <div id="loginForm">

        <h2>Acesso ao grupo</h2>

        <label for="loginSenha">
          Senha
        </label>

        <input
          type="password"
          id="loginSenha"
          placeholder="Digite a senha do grupo"
          autocomplete="current-password"
        >

        <button
          type="button"
          id="btnEntrar"
        >
          Entrar
        </button>

        <p
          id="loginMensagem"
          class="login-mensagem"
        ></p>

      </div>

    </section>

  </main>

  <script type="module" src="login.js"></script>

</body>

</html>
